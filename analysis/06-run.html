<!doctype html>
<meta charset="utf-8">
<title>Entry 06 analysis run</title>
<!-- Reproduces the figures in entry 06. Steps:
     1. python3 analysis/fetch_orkney_wind.py   (writes analysis/cache/orkney-wind.json)
     2. python3 -m http.server 5179             (from the repository root)
     3. open http://localhost:5179/analysis/06-run.html and save the JSON into data/06-orkney.json
     SSEN publishes half-hourly output of the generators under Orkney's active network management (ANM),
     total Orkney generation and Orkney demand, but not how much the ANM generators were held back.
     This estimates that three ways. The columns are labelled kW but the values are plainly MW
     (Orkney demand of 13 to 30), so they are treated as MW. -->
<body style="font:13px ui-monospace,Menlo,monospace;white-space:pre-wrap;padding:16px">running…
<script src="../lab.js"></script>
<script>
const DATASET = 'orkney_active_network_management';
const STRONG_WIND = 10;      // m/s at 100 m: both fleets should be producing well
const STRONG_OTHER = 8;      // MW from the other generators, so the comparison is not dominated by noise
const OFF_SHARE = 0.25;      // ANM producing under a quarter of its usual share counts as switched off
const MIN_CELL = 30;         // half-hours needed before a baseline is trusted
const r1 = x => Math.round(x * 10) / 10, r2 = x => Math.round(x * 100) / 100;
const q = (sorted, p) => sorted[Math.floor(p * (sorted.length - 1))];
const sortNum = a => Float64Array.from(a).sort();

const parseT = s => { const m = String(s).trim().match(/^(\d\d)\/(\d\d)\/(\d{4}) (\d\d):(\d\d)/); return m ? Date.UTC(+m[3], +m[2] - 1, +m[1], +m[4], +m[5]) : null; };
// Each year's file has its own layout: three date-value pairs in most, five in 2017, plain columns in 2024.
function parse(text) {
  const L = text.split(/\r?\n/).filter(Boolean), out = [];
  if (/^Timestamp,/.test(L[0])) {
    for (const l of L.slice(1)) { const [ts, a, g, d] = l.split(','), t = parseT(ts); if (t != null) out.push({ t, anm: +a, gen: +g, dem: +d }); }
    return out;
  }
  const head = L[1].split(','), gi = head.findIndex(h => /Total Generation/i.test(h)), di = head.findIndex(h => /Demand/i.test(h));
  for (const l of L.slice(3)) { const c = l.split(','), t = parseT(c[0]); if (t != null) out.push({ t, anm: +c[1], gen: +c[gi + 1], dem: +c[di + 1] }); }
  return out;
}

async function run() {
  const pkg = (await getJSON(CKAN + 'package_show?id=' + DATASET)).result;
  const files = pkg.resources.filter(r => /half hour/i.test(r.name));
  const [W, ...texts] = await Promise.all([getJSON('cache/orkney-wind.json'), ...files.map(r => fetch(r.url).then(x => { if (!x.ok) throw new Error(r.name + ' ' + x.status); return x.text(); }))]);
  let rows = texts.flatMap(parse).sort((a, b) => a.t - b.t);
  const issues = { rows: rows.length, nonNumeric: 0, negativeAnm: rows.filter(r => r.anm < 0).length, negativeDemand: rows.filter(r => r.dem < 0).length, anmAboveTotal: rows.filter(r => r.anm > r.gen + 0.5).length };
  rows = rows.filter(r => [r.anm, r.gen, r.dem].every(Number.isFinite) || (issues.nonNumeric++, false));

  // wind at 100 m, hourly, interpolated to each half-hour
  const t0 = Date.parse(W.time[0] + 'Z');
  for (const r of rows) { const h = (r.t - t0) / 36e5, i = Math.floor(h), f = h - i, a = W.ws100[i], b = W.ws100[i + 1]; r.w = a == null ? null : b == null ? a : a + (b - a) * f; r.other = r.gen - r.anm; r.exp = r.gen - r.dem; }
  window._rows = rows;   // kept for checks in the browser console
  const byYear = {}; for (const r of rows) (byYear[new Date(r.t).getUTCFullYear()] = byYear[new Date(r.t).getUTCFullYear()] || []).push(r);

  const monthKey = t => { const d = new Date(t); return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0'); };
  const byMonth = {}; for (const r of rows) (byMonth[monthKey(r.t)] = byMonth[monthKey(r.t)] || []).push(r.exp);
  const monthCap = Object.fromEntries(Object.entries(byMonth).map(([k, v]) => [k, q(sortNum(v), 0.999)]));
  const years = [], spellsAll = [];
  for (const [y, rs] of Object.entries(byYear)) {
    const anmE = rs.reduce((a, r) => a + Math.max(0, r.anm), 0) * 0.5 / 1000;   // GWh
    const genE = rs.reduce((a, r) => a + Math.max(0, r.gen), 0) * 0.5 / 1000, demE = rs.reduce((a, r) => a + Math.max(0, r.dem), 0) * 0.5 / 1000;
    const expS = sortNum(rs.map(r => r.exp)), anmS = sortNum(rs.map(r => r.anm));
    const cap = q(expS, 0.999), anmCap = q(anmS, 0.999);

    // A. switch-offs: strong wind, the other generators running, ANM producing almost nothing
    const strong = rs.filter(r => r.w >= STRONG_WIND && r.other >= STRONG_OTHER);
    const usual = q(sortNum(strong.map(r => r.anm / r.other)), 0.5);
    const off = strong.filter(r => r.anm < OFF_SHARE * usual * r.other);
    const lostA = off.reduce((a, r) => a + (usual * r.other - r.anm), 0) * 0.5 / 1000;
    let spell = null;
    for (const r of off) {
      if (spell && r.t - spell.end <= 18e5) { spell.end = r.t; spell.hh++; spell.lost += (usual * r.other - r.anm) * 0.5; spell.w += r.w; }
      else { if (spell) spellsAll.push(spell); spell = { start: r.t, end: r.t, hh: 1, lost: (usual * r.other - r.anm) * 0.5, w: r.w }; }
    }
    if (spell) spellsAll.push(spell);

    // B. export limit: half-hours where, judged only from demand and the other generators, ANM could not have pushed export to its limit
    //    The limit is taken month by month, since a cable out of service lowers it for weeks; the yearly version is kept for comparison.
    const exportLoss = limitOf => {
      const bins = {};
      for (const r of rs) { const b = Math.max(0, Math.floor(r.other)), o = bins[b] || (bins[b] = { n: 0, s: 0, un: 0, us: 0 }); o.n++; o.s += r.anm; if (limitOf(r) - (r.other - r.dem) >= anmCap + 2) { o.un++; o.us += r.anm; } }
      let pot = 0, act = 0; for (const o of Object.values(bins)) { act += o.s; pot += o.un >= MIN_CELL ? o.us / o.un * o.n : o.s; }
      return (pot - act) * 0.5 / 1000;
    };
    const lostB = exportLoss(r => monthCap[monthKey(r.t)]), lostByear = exportLoss(() => cap);
    // D. the steady gap: each fleet's average output as a share of its own top level (99.9th percentile)
    const otherCap = q(sortNum(rs.map(r => r.other)), 0.999);
    const yieldAnm = rs.reduce((a, r) => a + r.anm, 0) / rs.length / anmCap, yieldOther = rs.reduce((a, r) => a + r.other, 0) / rs.length / otherCap;

    // C. demand: same month and wind, lower-demand half against upper-demand half, measured as ANM output per MW from the other generators
    const cells = {};
    for (const r of rs) { if (r.w == null || r.w < 6) continue; const k = new Date(r.t).getUTCMonth() + '|' + Math.floor(r.w); (cells[k] = cells[k] || []).push(r); }
    let lostC = 0;
    for (const list of Object.values(cells)) {
      if (list.length < MIN_CELL) continue;
      const s = [...list].sort((a, b) => a.dem - b.dem), h = Math.floor(s.length / 2), lo = s.slice(0, h), hi = s.slice(h);
      const ratio = g => g.reduce((a, r) => a + r.anm, 0) / Math.max(1e-9, g.reduce((a, r) => a + r.other, 0));
      lostC += (ratio(hi) - ratio(lo)) * lo.reduce((a, r) => a + r.other, 0) * 0.5 / 1000;
    }
    const share = lost => r2(lost / (anmE + Math.max(0, lost)) * 100);
    years.push({ y: +y, hh: rs.length, anmGWh: r1(anmE), genGWh: r1(genE), demGWh: r1(demE), anmShare: r2(anmE / genE), exportCap: r1(cap), anmCap: r1(anmCap),
      nearCapPct: r2(rs.filter(r => r.exp >= cap - 2).length / rs.length * 100), netExporterPct: Math.round(rs.filter(r => r.exp > 0).length / rs.length * 100),
      switchOff: { hh: off.length, lostGWh: r2(lostA), share: share(lostA) }, exportLimit: { lostGWh: r2(lostB), share: share(lostB) }, exportLimitYearly: { lostGWh: r2(lostByear), share: share(lostByear) }, demand: { lostGWh: r2(lostC), share: share(lostC) },
      yieldAnm: r2(yieldAnm), yieldOther: r2(yieldOther), otherCap: r1(otherCap) });
  }

  // what a hard limit looks like: ANM output piles up under its ceiling; export just tails off
  const hist = (vals, lo, hi, step) => { const n = Math.round((hi - lo) / step), h = new Array(n).fill(0); for (const v of vals) { const i = Math.floor((v - lo) / step); if (i >= 0 && i < n) h[i]++; } return { lo, step, counts: h }; };
  const spells = spellsAll.sort((a, b) => b.lost - a.lost).slice(0, 10).map(s => ({ start: new Date(s.start).toISOString().slice(0, 16), hours: s.hh / 2, lostMWh: Math.round(s.lost), wind: r1(s.w / s.hh) }));
  const tot = k => r1(years.reduce((a, y) => a + y[k].lostGWh, 0));

  return {
    computed: new Date().toISOString(), wind: { lat: W.lat, lon: W.lon, source: 'Open-Meteo historical weather API (ERA5), wind speed at 100 m' },
    sources: files.map(r => ({ name: r.name.trim(), modified: r.last_modified || r.metadata_modified })).sort((a, b) => a.name.localeCompare(b.name)),
    period: [new Date(rows[0].t).toISOString().slice(0, 10), new Date(rows.at(-1).t).toISOString().slice(0, 10)],
    thresholds: { strongWind: STRONG_WIND, strongOther: STRONG_OTHER, offShare: OFF_SHARE, minCell: MIN_CELL },
    lowExportMonths: (() => {
      // months whose export never came near the usual limit, with how windy they were and how the two groups of generators did
      const stats = {}; for (const r of rows) { const k = monthKey(r.t), o = stats[k] || (stats[k] = { n: 0, w: 0, anm: 0, other: 0 }); o.n++; o.w += r.w ?? 0; o.anm += r.anm; o.other += r.other; }
      const windRank = Object.entries(stats).sort((a, b) => b[1].w / b[1].n - a[1].w / a[1].n).map(([k]) => k);
      const prev = k => { const [y, m] = k.split('-'); return (+y - 1) + '-' + m; };
      return Object.entries(monthCap).filter(([, c]) => c < 15).map(([m, c]) => { const o = stats[m], p = stats[prev(m)];
        return { m, cap: r1(c), windRank: windRank.indexOf(m) + 1, months: windRank.length, anm: r1(o.anm / o.n), other: r1(o.other / o.n),
          prev: p ? { m: prev(m), windRank: windRank.indexOf(prev(m)) + 1, anm: r1(p.anm / p.n), other: r1(p.other / p.n) } : null }; });
    })(),
    issues, years, spells, totals: { anmGWh: r1(years.reduce((a, y) => a + y.anmGWh, 0)), switchOff: tot('switchOff'), exportLimit: tot('exportLimit'), demand: tot('demand') },
    hist: { anm: hist(rows.map(r => r.anm), 0, 22, 0.5), export: hist(rows.map(r => r.exp), 0, 32, 0.5) }
  };
}
run().then(r => { window._result = r; const s = JSON.stringify(r); document.body.textContent = `done: ${r.years.length} years, ${(s.length / 1024).toFixed(0)} KB\n\n` + JSON.stringify(r, null, 1); })
  .catch(e => { window._error = String(e); document.body.textContent = 'failed: ' + e; });
</script>
