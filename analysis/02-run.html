<!doctype html>
<meta charset="utf-8">
<title>Entry 02 analysis run</title>
<!-- Reproduces the figures in entry 02. Steps:
     1. python3 analysis/fetch_wind.py        (writes analysis/cache/wind.json)
     2. python3 -m http.server 5179           (from the repository root)
     3. open http://localhost:5179/analysis/02-run.html and copy the JSON into data/02-wind.json
     SSEN's API only answers browsers, which is why the join runs here and not in Python. -->
<body style="font:13px ui-monospace,Menlo,monospace;white-space:pre-wrap;padding:16px">running…
<script src="../lab.js"></script>
<script>
const HV = { SHEPD: '245d5825-7d83-4d17-a2c5-04b473b9b408', SEPD: 'f0d9d3fe-6739-4700-a699-f227b4e1de41' };
const FIELDS = ['DISTRICT_SHORT_CODE', 'HV_INCIDENT_TIME', 'CAUSE_CODE', 'EXCEPTIONAL_EVENT', 'HV_CUST_MINS_LOST'];
const WIND_CAUSES = new Set(['6', '21', '23', '24']);   // wind and gale, windborne materials, falling live trees, falling dead trees
const PLANNED_CAUSES = new Set(['75', '86']);            // operational or safety restriction; interruption to remove a generator: not weather faults
const BINS = [0, 20, 30, 40, 50, 60, 70, Infinity];      // daily maximum gust, mph
const CALM = 30, WINDY = 50, BOOT = 500;
const r3 = x => x == null || !Number.isFinite(x) ? null : +x.toPrecision(3);
const rng = (s => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; })(20261120);
const q = (arr, p) => { const s = [...arr].sort((a, b) => a - b); return s[Math.min(s.length - 1, Math.floor(p * s.length))]; };

async function run() {
  const wind = await getJSON('cache/wind.json');
  const dayIx = new Map(wind.days.map((d, i) => [d, i])), nDays = wind.days.length;
  const keys = Object.keys(wind.gust);
  const [n, s, mn, ms] = await Promise.all([fetchAll(HV.SHEPD, FIELDS), fetchAll(HV.SEPD, FIELDS),
    getJSON(CKAN + 'resource_show?id=' + HV.SHEPD), getJSON(CKAN + 'resource_show?id=' + HV.SEPD)]);

  // per district and day: faults, wind-attributed, exceptional-flagged, customer-minutes lost
  const D = Object.fromEntries(keys.map(k => [k, { f: new Uint16Array(nDays), w: new Uint16Array(nDays), x: new Uint16Array(nDays), cml: new Float64Array(nDays) }]));
  const dropped = { outsidePeriod: 0, unknownDistrict: 0, planned: 0 };
  let used = 0;
  for (const [area, rows] of [['SHEPD', n], ['SEPD', s]]) for (const r of rows) {
    const d = D[area + '/' + r.DISTRICT_SHORT_CODE], i = dayIx.get(String(r.HV_INCIDENT_TIME).slice(0, 10));
    if (!d) { dropped.unknownDistrict++; continue; }
    if (i == null) { dropped.outsidePeriod++; continue; }
    if (PLANNED_CAUSES.has(String(r.CAUSE_CODE))) { dropped.planned++; continue; }
    used++; d.f[i]++; d.cml[i] += +r.HV_CUST_MINS_LOST || 0;
    if (WIND_CAUSES.has(String(r.CAUSE_CODE))) d.w[i]++;
    if (r.EXCEPTIONAL_EVENT === 'Yes') d.x[i]++;
  }

  // network-wide daily totals, used to find and leave out the biggest storms
  const byDay = wind.days.map((date, i) => ({ i, date, faults: keys.reduce((a, k) => a + D[k].f[i], 0), wind: keys.reduce((a, k) => a + D[k].w[i], 0), exc: keys.reduce((a, k) => a + D[k].x[i], 0),
    cml: Math.round(keys.reduce((a, k) => a + D[k].cml[i], 0)), maxGust: Math.max(...keys.map(k => wind.gust[k][i] ?? 0)), districtsOver50: keys.filter(k => wind.gust[k][i] >= WINDY).length }));
  const ranked = [...byDay].sort((a, b) => b.faults - a.faults);
  const bigStorms = ranked.filter(d => d.districtsOver50 > 0).slice(0, 3);   // the three worst windy days
  const skip = new Set(bigStorms.map(d => d.i));

  const binOf = g => { for (let b = 0; b < BINS.length - 1; b++) if (g < BINS[b + 1]) return b; };
  const analyse = (dayOk, withDistricts) => {
    const bins = BINS.slice(0, -1).map((lo, b) => ({ lo, hi: Number.isFinite(BINS[b + 1]) ? BINS[b + 1] : null, days: 0, faults: 0, wind: 0, exc: 0, cml: 0, expected: 0 }));
    const districts = [];
    for (const k of keys) {
      const g = wind.gust[k], d = D[k], calmIx = [], windyIx = [];
      for (let i = 0; i < nDays; i++) { if (g[i] == null || !dayOk(i)) continue; if (g[i] < CALM) calmIx.push(i); else if (g[i] >= WINDY) windyIx.push(i); }
      const sumF = ix => ix.reduce((a, i) => a + d.f[i], 0), sumC = ix => ix.reduce((a, i) => a + d.cml[i], 0);
      const calmRate = sumF(calmIx) / calmIx.length;
      for (let i = 0; i < nDays; i++) {
        if (g[i] == null || !dayOk(i)) continue;
        const b = bins[binOf(g[i])];
        b.days++; b.faults += d.f[i]; b.wind += d.w[i]; b.exc += d.x[i]; b.cml += d.cml[i]; b.expected += calmRate;
      }
      if (!withDistricts) continue;
      const wf = sumF(windyIx), ratio = windyIx.length && wf ? (wf / windyIx.length) / calmRate : null;
      // Day-level bootstrap: resample calm days and windy days with replacement, so a storm day's many faults move together.
      const boots = [];
      if (ratio) for (let b = 0; b < BOOT; b++) {
        let cf = 0, w = 0;
        for (let j = 0; j < calmIx.length; j++) cf += d.f[calmIx[Math.floor(rng() * calmIx.length)]];
        for (let j = 0; j < windyIx.length; j++) w += d.f[windyIx[Math.floor(rng() * windyIx.length)]];
        if (cf > 0) boots.push((w / windyIx.length) / (cf / calmIx.length));
      }
      const worst = [...windyIx].sort((a, b) => d.f[b] - d.f[a]);
      const without = m => { const keep = worst.slice(m); return keep.length ? (sumF(keep) / keep.length) / calmRate : null; };
      // Against the district's own climate: its windiest 2% of days compared with its calmer half.
      const sorted = [...g].filter(v => v != null).sort((a, b) => a - b), p50 = sorted[Math.floor(sorted.length * .5)], p98 = sorted[Math.floor(sorted.length * .98)];
      let ld = 0, lf = 0, hd = 0, hf = 0; for (let i = 0; i < nDays; i++) { if (g[i] == null) continue; if (g[i] < p50) { ld++; lf += d.f[i]; } else if (g[i] >= p98) { hd++; hf += d.f[i]; } }
      const cmlCalm = sumC(calmIx) / calmIx.length, cmlWindy = windyIx.length ? sumC(windyIx) / windyIx.length : null;
      districts.push({ key: k, calmDays: calmIx.length, calmFaults: sumF(calmIx), calmRate: r3(calmRate), windyDays: windyIx.length, windyFaults: wf, windyRate: r3(windyIx.length ? wf / windyIx.length : null),
        ratio: r3(ratio), lo: r3(boots.length ? q(boots, .025) : null), hi: r3(boots.length ? q(boots, .975) : null),
        without1: r3(without(1)), without3: r3(without(3)), worstDay: worst.length ? wind.days[worst[0]] : null, worstShare: r3(worst.length ? d.f[worst[0]] / wf : null),
        own: r3((hf / hd) / (lf / ld)), ownGust: r3(p98), cmlRatio: r3(cmlWindy != null && cmlCalm > 0 ? cmlWindy / cmlCalm : null) });
    }
    return { bins: bins.map(b => ({ lo: b.lo, hi: b.hi, days: b.days, faults: b.faults, perDay: r3(b.faults / b.days), ratio: r3(b.faults / b.expected), windShare: r3(b.wind / b.faults), excShare: r3(b.exc / b.faults), cml: Math.round(b.cml) })), districts };
  };
  const all = analyse(() => true, true);
  const winter = analyse(i => { const m = +wind.days[i].slice(5, 7); return m >= 10 || m <= 3; }, false);
  const noStorms = analyse(i => !skip.has(i), false);
  const tot = (bs, f) => bs.reduce((a, b) => a + f(b), 0), windy = bs => bs.filter(b => b.lo >= WINDY);
  const share = bs => ({ days: r3(tot(windy(bs), b => b.days) / tot(bs, b => b.days)), faults: r3(tot(windy(bs), b => b.faults) / tot(bs, b => b.faults)), cml: r3(tot(windy(bs), b => b.cml) / tot(bs, b => b.cml)) });
  const cmlSorted = byDay.map(d => d.cml).sort((a, b) => b - a), cmlTotal = cmlSorted.reduce((a, b) => a + b, 0);

  return {
    computed: new Date().toISOString(), period: [wind.days[0], wind.days.at(-1)], districts: keys.length, districtDays: tot(all.bins, b => b.days),
    faults: { published: n.length + s.length, used, ...dropped },
    sources: [{ name: mn.result.name + ' (SHEPD)', modified: mn.result.last_modified }, { name: ms.result.name + ' (SEPD)', modified: ms.result.last_modified }],
    thresholds: { calmBelow: CALM, windyFrom: WINDY }, windCauses: [...WIND_CAUSES], plannedCauses: [...PLANNED_CAUSES], bootstrap: BOOT,
    bins: all.bins, share: share(all.bins), byDistrict: all.districts,
    winter: { bins: winter.bins.map(b => ({ lo: b.lo, days: b.days, faults: b.faults, ratio: b.ratio })), share: share(winter.bins) },
    withoutBigStorms: { dates: bigStorms.map(d => d.date), bins: noStorms.bins.map(b => ({ lo: b.lo, days: b.days, faults: b.faults, ratio: b.ratio })), share: share(noStorms.bins) },
    cmlTop5: r3(cmlSorted.slice(0, 5).reduce((a, b) => a + b, 0) / cmlTotal),
    medianFaultsPerDay: [...byDay].sort((a, b) => a.faults - b.faults)[Math.floor(nDays / 2)].faults,
    topDays: ranked.slice(0, 12).map(d => ({ date: d.date, faults: d.faults, cml: d.cml, maxGust: r3(d.maxGust), districtsOver50: d.districtsOver50, windShare: r3(d.wind / d.faults), excShare: r3(d.exc / d.faults) })),
  };
}
run().then(r => { window._result = r; document.body.textContent = JSON.stringify(r); }).catch(e => { window._error = String(e); document.body.textContent = 'failed: ' + e; });
</script>
